name: checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-reproduce.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m unittest discover -s tests -v
      - run: python -m dataclinic reproduce --config configs/smoke.json --output results/tmp --docs results/tmp/site
      - run: python -m dataclinic audit --output results/tmp --docs results/tmp/site
      - run: node tests/check_demo.cjs results/tmp/site/index.html

