[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataclinic-research"
version = "0.1.0"
description = "A reproducible benchmark for label-error review under a limited budget"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Swarit Mishra"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.5,<2",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
]

[project.scripts]
dataclinic = "dataclinic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

